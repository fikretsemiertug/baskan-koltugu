<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Başkan Koltuğu</title>
<style>
:root{--bg:#0e1a14;--panel:#16261d;--panel2:#1d3226;--line:#2b4636;--tx:#eef3ee;--mut:#9fb3a6;--gold:#e7b84a;--red:#e2574c;--grn:#4cc38a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px 12px 90px}
h1{font-size:28px;margin:10px 0 2px;letter-spacing:.5px}
h2{font-size:18px;margin:0 0 8px}
.mut{color:var(--mut)}.small{font-size:12.5px}
.btn{display:block;width:100%;padding:13px 14px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font-size:15px;text-align:left;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.45}
.btn.pri{background:var(--gold);color:#1b1405;border-color:var(--gold);font-weight:700;text-align:center}
.btn.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.btn small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sbtn{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font-size:12.5px;font-family:inherit;cursor:pointer;white-space:nowrap}
.sbtn.gold{background:var(--gold);color:#1b1405;border-color:var(--gold);font-weight:700}
.sbtn.red{border-color:#7a2e28;color:#ff9a90}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.g{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px 8px;text-align:center}
.g .i{font-size:18px}.g .n{font-size:11px;color:var(--mut)}
.bar{height:6px;background:#0a120d;border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;transition:width .5s}
.card{background:linear-gradient(180deg,#f3ead2,#e6d7b0);color:#2a2112;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.card .who{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#7a5d22;font-weight:700}
.card h3{margin:4px 0 8px;font-size:19px}
.card .btn{background:#fffaf0;color:#2a2112;border-color:#c9b27a}
.card .chip{background:rgba(0,0,0,.08)}
.card .up{color:#1f7a49}.card .dn{color:#b03a2e}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.08)}
.up{color:var(--grn)}.dn{color:var(--red)}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b150f;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:11px 2px;background:none;border:0;color:var(--mut);font-size:12px;font-family:inherit;position:relative}
.tabs button.on{color:var(--gold);font-weight:700}
.tabs .dot::after{content:'';position:absolute;top:7px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.ticker{overflow:hidden;white-space:nowrap;background:#09110c;border:1px solid var(--line);border-radius:10px;padding:6px 0;font-size:13px;margin-bottom:8px}
.ticker span{display:inline-block;padding-left:100%;animation:tk 30s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 3px;border-bottom:1px solid var(--line);text-align:center}
td.l,th.l{text-align:left}
tr.me{background:rgba(231,184,74,.15);font-weight:700}
.score{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.score b{font-size:34px;font-variant-numeric:tabular-nums;white-space:nowrap}
.feed{height:240px;overflow:auto;font-size:13.5px;background:#0a130e;border-radius:10px;padding:8px;border:1px solid var(--line)}
.feed div{padding:4px 0;border-bottom:1px dashed #1c2e23}
.feed .goal{color:var(--gold);font-weight:700}.feed .bad{color:#ff8a80}.feed .info{color:#8fc6ff}
.minute{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;text-align:center}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a130e;color:var(--tx);font-size:15px;margin:4px 0 6px;font-family:inherit}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 .btn{margin:0}
.big{font-size:40px;text-align:center;margin:6px 0}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.logi{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.topbar .ic{background:none;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:5px 10px;font-size:15px;cursor:pointer}
.pl{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.pl .nm{flex:1;min-width:0}.pl .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{min-width:34px;text-align:center;font-weight:700;border-radius:8px;padding:3px 0;background:#0a130e;font-variant-numeric:tabular-nums}
.pos{font-size:11px;font-weight:700;border-radius:6px;padding:2px 5px;min-width:22px;text-align:center}
.pos.K{background:#5b4a14;color:#ffd96a}.pos.D{background:#173a5c;color:#8fc6ff}.pos.O{background:#1b4a33;color:#7fe0ac}.pos.F{background:#5c1f1b;color:#ff9a90}
.pitch{background:repeating-linear-gradient(180deg,#1f6b3c 0 38px,#1b6036 38px 76px);border:2px solid #cfe9d6;border-radius:12px;padding:10px 4px;position:relative}
.prow{display:flex;justify-content:space-around;margin:9px 0}
.slot{width:62px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;border-radius:10px;padding:4px 2px;font-size:10.5px;text-align:center;cursor:pointer;font-family:inherit;line-height:1.2}
.slot b{display:block;font-size:14px}
.slot.sel{background:var(--gold);color:#1b1405;border-color:var(--gold)}
.slot.oop{border-color:#ff8a80;box-shadow:0 0 0 1px #ff8a80 inset}
.fbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:9;max-width:90%;text-align:center}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#0a130e;border:1px solid var(--line);border-radius:8px;padding:8px;word-break:break-all;margin:6px 0}
.banner{background:#3a1c18;border:1px solid #7a2e28;color:#ffcfc9;border-radius:12px;padding:8px 12px;font-size:13.5px;margin:8px 0}
.paper{background:#f4efe1;color:#1d1a14;border-radius:6px;padding:12px 14px;margin:10px 0;font-family:Georgia,"Times New Roman",serif;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.paper .np{font-size:11px;letter-spacing:2px;text-transform:uppercase;border-bottom:2px solid #1d1a14;padding-bottom:4px;margin-bottom:6px;font-weight:700}
.paper .hl{font-size:22px;font-weight:900;line-height:1.15}
.paper .sub{font-size:14px;margin-top:4px;font-style:italic}
.museum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.trophy{display:flex;flex-direction:column;align-items:center;font-size:30px;background:#0a130e;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.trophy small{font-size:10.5px;color:var(--mut);text-align:center;line-height:1.2}
.ic.on{background:var(--gold);color:#1b1405;border-color:var(--gold)}
.paper .col{font-size:13px;margin-top:8px;padding-top:6px;border-top:1px solid #c9bfa6}
.grade{font-size:56px;font-weight:900;text-align:center;color:var(--gold);line-height:1.1}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:#0a130e;opacity:.45;font-size:12px;cursor:pointer}
.ach.got{opacity:1;border:1px solid var(--gold)}
.ach>span{font-size:22px}
.subtabs{display:grid;gap:6px;margin:10px 0 4px}
.subtabs button{position:relative;padding:8px 2px 7px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font-size:11.5px;font-family:inherit;cursor:pointer;line-height:1.2}
.subtabs button .si{display:block;font-size:18px;margin-bottom:2px}
.subtabs button.on{background:var(--gold);color:#1b1405;border-color:var(--gold);font-weight:700}
.badge{position:absolute;top:3px;right:5px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;line-height:16px;font-weight:700}
.subtabs button.on .badge{background:#1b1405;color:var(--gold)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700}
.mini .bar{height:4px;margin-top:3px}
.acts{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.acts .sbtn{padding:5px 8px;font-size:12px}
.opt3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.opt3 .btn{margin:0;text-align:center;font-size:13px;padding:10px 4px}
.ibox{background:#0a130e;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px}.ibox span{display:block;color:var(--mut);font-size:11px}
.goal{background:#13241b;border:1px dashed var(--gold);border-radius:12px;padding:8px 12px;font-size:13px;margin:8px 0}.goal.done{border-style:solid;opacity:.75}
.stbar{display:flex;align-items:center;gap:8px;margin-bottom:4px}.stbar .bar{flex:1;height:8px}
div.slot{cursor:default}
.talk{background:#0a130e;border:1px solid var(--gold);border-radius:12px;padding:10px;margin:4px 0 8px}
.talk .btn{margin:0;font-size:13px;padding:9px 10px}
.wrow{display:flex;flex-direction:column;gap:4px;margin:6px 0}
input[type=range]{width:100%;padding:0;margin:4px 0;accent-color:var(--gold);background:none;border:0}
.pbar{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px}.pbar .bar{flex:1;height:8px}
.loan{background:#0a130e;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.agb{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-family:inherit;font-size:11px;padding:6px 2px;cursor:pointer;line-height:1.2}
.agb span{display:block;font-size:18px}.agb small{display:block;color:var(--mut);font-size:9.5px;margin-top:2px}
.agb.done{border-color:var(--grn);opacity:.55}.agb:disabled{opacity:.45}
:root{--club:#1f6b3c}
.topbar{border-bottom:3px solid var(--club);padding-bottom:6px}
.tip{background:#1d2f45;border:1px solid #5aa9e6;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:8px 0}
.todo{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--club);border-radius:12px;padding:10px 12px;margin:8px 0}
.tdi{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.swt{width:28px;height:28px;border-radius:50%;border:2px solid #ffffff44;cursor:pointer;padding:0}
.swt.on{border:3px solid var(--gold);transform:scale(1.1)}
/* ---- ofis düzeni ---- */
.tabs{position:sticky;top:0;bottom:auto;z-index:30;border-top:0;border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 4px 0;background:rgba(11,21,15,.97);backdrop-filter:blur(8px)}
.tabs button{border-radius:12px;margin:5px 2px;padding:7px 2px}
.tabs button.on{background:rgba(231,184,74,.12);box-shadow:inset 0 0 0 1.5px var(--gold)}
#app{padding-bottom:110px}
.advbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:14px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(14,26,20,0),var(--bg) 35%)}
.advbar button{display:block;width:100%;max-width:496px;margin:0 auto;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font:700 17px/1.2 inherit;font-family:inherit;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.45)}
.advbar small{display:block;font-weight:400;font-size:11.5px;color:var(--mut);margin-top:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill.grn{color:#9ff0b8;border-color:#2f6b47}.pill.gold{color:var(--gold);border-color:#6b5520}
.dotg{width:8px;height:8px;border-radius:50%;background:var(--grn);display:inline-block}
.ccard{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--club);border-radius:16px;padding:12px 14px;margin:8px 0}
.ccrest svg{display:block}.cname{font-size:19px;font-weight:800;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ckasa{text-align:right;border-left:1px solid var(--line);padding-left:12px}.ckasa b{display:block;font-size:20px}
.gcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--club);border-radius:16px;padding:4px 14px;margin:8px 0}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.gcard .crow:last-of-type{border-bottom:0}
.gold{color:var(--gold)}.tagr{background:var(--red);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800}
.badge{background:var(--gold);color:#1b1405;border-radius:12px;padding:1px 8px;font-size:12px;font-weight:800;margin-left:4px}
.trow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:7px 0;cursor:pointer;font-size:14px}
.gcard .trow{background:var(--panel2)}
.doci{border-left:4px solid var(--gold)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:16px;padding:12px;cursor:pointer;min-height:118px}
.tile:active{transform:scale(.98)}
.tic{position:relative;height:52px;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--panel2);border-radius:12px;margin-bottom:8px}
.tb{position:absolute;top:6px;right:6px;min-width:22px;height:22px;border-radius:11px;background:#33443a;color:var(--tx);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}.tb.on{background:var(--gold);color:#1b1405}
.tt{font-weight:800;font-size:15.5px}.ts{font-size:12px;color:var(--mut);margin-top:2px}
.doc{background:#f3ead4;color:#2a2214;border-radius:6px 6px 16px 16px;padding:16px;margin:10px 0;box-shadow:0 8px 24px rgba(0,0,0,.4);border-top:6px solid var(--club)}
.doc h3{margin:6px 0;font-size:19px}.doc .dhead{display:flex;justify-content:space-between;font-size:12px;color:#6d5f43}.doc .lbl{color:#6d5f43}
.doc .btn{background:#fff9ea;color:#2a2214;border-color:#d8c9a3}.doc .dn{color:#b3261e}
.ozov{position:fixed;inset:0;z-index:50;background:rgba(5,10,7,.88);overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 12px 30px}
.ozbox{max-width:496px;margin:0 auto}
.sech{border-left:4px solid var(--gold);padding-left:10px;font-size:22px}
.pillrow{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:10px 0}
.ozi{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.ozi:last-child{border-bottom:0}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.gbox span{display:block;font-size:11px;color:var(--mut)}.gbox b{display:block;font-size:16px}.gbox i{font-style:normal;font-size:11.5px}
.mday{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;margin:8px 0}
.mvs{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0;font-size:16px}.mvs span{color:var(--mut);font-size:13px}
.acard{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.ahead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.astar{background:#f3ead4;color:#1b1405;border-radius:10px;padding:6px 9px;font-weight:800;font-size:16px;white-space:nowrap}.astar.sm{font-size:13px;padding:4px 7px}
.agrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acol{min-width:0}.ahd{font-size:11px;letter-spacing:1px;color:var(--mut);margin-bottom:3px}
.arow{display:flex;justify-content:space-between;gap:4px;font-size:12px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.arow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}
.mtbl{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}.mtbl.open{border-color:var(--gold)}
.mth{display:flex;align-items:center;gap:12px;cursor:pointer}.mti{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:24px}
.blu{color:#6fb6ff}.mtq{margin:10px 0 4px;font-size:15px}
.qbtn{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid #2f6b47;color:#bff0cf;border-radius:14px;padding:10px 12px;margin:6px 0;font-family:inherit;font-size:14.5px;cursor:pointer}.qbtn small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.agp{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:8px}

.hnote{background:var(--panel2);border-left:3px solid var(--gold);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:14px}

function spOffers(slot){S.spOff=S.spOff||{};const key=slot+S.season;if(S.spOff[key])return S.spOff[key];
 const base=SPS[slot].b*(S.div===1?1:.5)*({buyuk:1.4,anadolu:1,yeni:.8}[S.type])*(.7+S.st.t/100)*((S.fans&&S.fans.kur<25)?.8:1);
 const o=[{tip:'bahis',f:pick(SPF.bahis),pay:Math.max(1,Math.round(base*1.4)),y:2},{tip:'yerel',f:pick(SPF.yerel),pay:Math.max(1,Math.round(base*.8)),y:2},{tip:'global',f:pick(SPF.global),pay:Math.max(1,Math.round(base*1.1)),y:3}];
 S.spOff[key]=o;return o}
function signSp(slot,i){const o=spOffers(slot)[i];if(!o||S.sp[slot])return;S.sp[slot]={f:o.f,pay:o.pay,y:o.y,tip:o.tip};S.st.k=clamp(S.st.k+o.pay,0,100);fin('sponsor',o.pay);
 if(o.tip==='bahis')apply({m:-5,c:-3},false);if(o.tip==='yerel'){apply({t:3},false);S.fans.aile=clamp(S.fans.aile+5,0,100)}if(o.tip==='global')S.fans.kur=clamp(S.fans.kur+6,0,100);
 if(slot==='gogus')S.flags.sponsor=1;log(`${SPS[slot].n} sponsoru: ${o.f} (${eur(o.pay)}/sezon, ${o.y} sezon).`);news(`${S.club} ile ${o.f} arasında ${SPS[slot].n.toLowerCase()} sponsorluğu anlaşması.`);snd('coin');toast(`✍️ ${o.f} ile anlaşıldı: +${eur(o.pay)}`);save();render()}
function spTick(){let tot=0;for(const k of Object.keys(SPS)){const s=S.sp[k];if(!s)continue;s.y--;if(s.y<=0){S.sp[k]=null;log(`${SPS[k].n} sponsoru ${s.f} ile sözleşme bitti.`);news(`${s.f} sponsorluğu sona erdi.`)}else{tot+=s.pay}}
 S.flags.sponsor=S.sp.gogus?1:0;if(tot){S.st.k=clamp(S.st.k+tot,0,100);fin('sponsor',tot)}}

// ================= 5. tur: maaşlar, ekip, pazarlık, krediler, basın =================
const r1=v=>Math.round(v*10)/10;
function kAcc(x){S.kacc=(S.kacc||0)+x;const n=Math.trunc(S.kacc);S.kacc=Math.round((S.kacc-n)*100)/100;return n}

// ---- oyuncu maaşları ve memnuniyet ----
const demRaw=p=>Math.max(.1,Math.pow(Math.max(0,p.r-48),1.6)/75);function wfac(){if(!S)return 1;let f={buyuk:1,anadolu:.72,yeni:.6}[S.type]||.75;if(S.div===2)f*=.7;return f}const demand=p=>r1(Math.max(.15,demRaw(p)*wfac()));
function happy(p){if(p.w==null)return 60;let h=60+(p.w/Math.max(.1,demand(p))-1)*80-((p.bw||0)>=4?15:0)+(p.award===S.season-1?5:0)+(p.msb||0);if(p.angry)h-=25;return clamp(Math.round(h),0,100)}
const happyIc=p=>{const h=happy(p);return h>=70?'😊':h>=40?'😐':'😠'};
function setWage(id,v){const p=P(id);if(!p)return;const old=p.w;p.w=r1(+v);if(p.w<old)p.msb=(p.msb||0)-Math.round((old-p.w)/Math.max(.1,demand(p))*30);log(`${p.n}’in maaşı ${eur1(old)} → ${eur1(p.w)} (yıllık).`);save();render()}
const playerWages=()=>S.squad.reduce((a,p)=>a+(p.w||0),0);
const staffWages=()=>Object.values(S.staff||{}).reduce((a,s)=>a+(s?s.w:0),0)+(S.hoca?(S.hoca.w!=null?S.hoca.w:r1(.4+S.hoca.q*.5)):0);
const seasonWages=()=>playerWages()+staffWages();
const wagePerPay=()=>seasonWages()/12;
function msDecay(){S.squad.forEach(p=>{if(p.msb)p.msb=Math.round(p.msb*.85)})}

// ---- teknik ekip ----
const STAFF={fd:{n:'Futbol direktörü',i:'🧭',d:'Piyasayı tarar, dünyadan genç yetenek bulur'},alt:{n:'Altyapı hocası',i:'🌱',d:'U19 gelişimini ve altyapı kalitesini artırır'},dr:{n:'Doktor',i:'🩺',d:'Sakatlık sürelerini kısaltır'},kon:{n:'Kondisyoner',i:'🏃',d:'Sakatlık riskini azaltır, formu korur'}};
const sDem=q=>r1(q*.5);
function genStaff(q){q=q||RI(1,5);return{n:nm(),q,w:sDem(q)}}
function staffQ(k){const s=S.staff&&S.staff[k];if(!s)return 0;return s.q*clamp(Math.sqrt(s.w/Math.max(.1,sDem(s.q))),.6,1.25)}
let STC=null;
function staffCands(k){S.stc=S.stc||{};const key=k+(S.season*100+S.week);if(!S.stc[key])S.stc[key]=[genStaff(RI(1,2)),genStaff(RI(2,4)),genStaff(RI(4,5))];return S.stc[key]}
function hireStaff(k,i){const c=staffCands(k)[i];const old=S.staff[k];const fee=c.q+(old?Math.ceil(old.w):0);if(S.st.k-fee<1)return toast('Kasa yetmez (imza parası + eski çalışanın tazminatı).');
 S.st.k-=fee;fin('teknik',-fee);S.staff[k]={n:c.n,q:c.q,w:c.w};STC=null;S.stc={};log(`${STAFF[k].n}: ${c.n} (${'★'.repeat(c.q)}) göreve başladı (${eur(fee)}).`);news(`${S.club}, ${STAFF[k].n.toLowerCase()} olarak ${c.n}’i getirdi.`);snd('coin');save();render()}
function fireStaff(k){const s=S.staff[k];if(!s)return;const fee=Math.ceil(s.w);S.st.k=clamp(S.st.k-fee,0,100);fin('teknik',-fee);S.staff[k]=null;log(`${STAFF[k].n} ${s.n} ile yollar ayrıldı (${eur(fee)} tazminat).`);save();render()}
function setStaffWage(k,v){const s=S.staff[k];if(!s)return;s.w=r1(+v);save();render()}
function staffPayday(){for(const k of Object.keys(STAFF)){const s=S.staff[k];if(s&&s.w<sDem(s.q)*.8&&Math.random()<.25){S.staff[k]=null;news(`${STAFF[k].n} ${s.n} düşük maaş yüzünden istifa etti.`);log(`${STAFF[k].n} ${s.n} düşük maaş nedeniyle istifa etti.`)}}}

// ---- futbol direktörünün yetenek taraması ----
const COUNTRY={'🇧🇷 Brezilya':[['João','Gabriel','Thiago','Matheus','Caio'],['Souza','Oliveira','Lima','Carvalho','Ribeiro']],'🇦🇷 Arjantin':[['Tomás','Nicolás','Agustín','Facundo'],['Fernández','Gómez','Ruiz','Acosta']],'🇳🇬 Nijerya':[['Chidi','Emeka','Tunde','Ifeanyi'],['Okoro','Adeyemi','Nwosu','Eze']],'🇬🇭 Gana':[['Kwame','Kofi','Yaw','Kwabena'],['Asante','Owusu','Mensah','Darko']],'🇷🇸 Sırbistan':[['Luka','Nikola','Stefan','Marko'],['Petrović','Jovanović','Ilić','Marković']],'🇨🇴 Kolombiya':[['Juan','Andrés','Camilo','Sebastián'],['Ramírez','Vargas','Castro','Rojas']],'🇯🇵 Japonya':[['Haruto','Ren','Sota','Yuto'],['Sato','Tanaka','Kobayashi','Ito']],'🇬🇪 Gürcistan':[['Giorgi','Levan','Saba','Luka'],['Beridze','Kapanadze','Lomidze','Gelashvili']],'🇸🇳 Senegal':[['Moussa','Cheikh','Ibrahima','Pape'],['Ndiaye','Sarr','Diop','Faye']],'🇩🇪 Almanya (gurbetçi)':[['Emre','Yunus','Can','Deniz'],['Kaya','Yılmaz','Arslan','Doğan']]};
function fdSearch(){const q=staffQ('fd');if(!S.staff.fd)return toast('Önce bir futbol direktörü işe al.');const wk=S.season*100+S.week;if(S.fdW&&wk-S.fdW<3)return toast('Futbol direktörü bir taramayı yeni bitirdi. 3 hafta bekle.');if(S.st.k<2)return toast('Tarama için kasada para yok.');
 S.st.k-=1;fin('teknik',-1);S.fdW=wk;const n=1+(q>=3?1:0)+(q>=4.5?1:0);S.fdFind=[];
 for(let i=0;i<n;i++){const c=pick(Object.keys(COUNTRY));const [f,l]=COUNTRY[c];const age=RI(16,19);const r=RI(50,60)+Math.round(q);const pot=Math.min(93,r+RI(10,18)+Math.round(q*2.2));
  S.fdFind.push({id:'y'+(S.pid++),n:pick(f)+' '+pick(l),c,pos:pick(['D','O','O','F','F']),age,r,pot,fee:Math.max(1,Math.round((pot-60)/6))})}
 log(`${S.staff.fd.n} ${n} genç yetenek raporu sundu.`);snd('coin');save();render()}
function signFind(id){const y=(S.fdFind||[]).find(x=>x.id===id);if(!y)return;if(S.st.k-y.fee<1)return toast('Kasa yetmez.');S.st.k-=y.fee;fin('transfer',-y.fee);budSpend(y.fee);S.fdFind=S.fdFind.filter(x=>x!==y);
 if(y.age<=18){S.u19.push({id:S.pid++,n:y.n,pos:y.pos,r:y.r,age:y.age,pot:y.pot,c:y.c});log(`${y.c} kökenli ${y.n} U19’a katıldı (${eur(y.fee)}).`)}else{if(S.squad.length>=26)return toast('A takım dolu.');const p=addP(y.pos,y.r,y.age,0,y.n,3);p.pot=y.pot;p.w=demand(p);log(`${y.c} kökenli ${y.n} A takıma katıldı.`)}
 news(`${S.club}, ${y.c.split(' ').slice(1).join(' ')}’dan genç ${y.n}’i transfer etti.`);snd('coin');toast(`${y.n} kulübe katıldı!`);save();render()}

// ---- transfer pazarlığı ----
let NEG=null;
function rep(){return (S.div===1?20:0)+({buyuk:15,anadolu:5,yeni:0}[S.type])+(S.euro?10:0)+Math.min(15,(S.museum||[]).length*3)+(rankOrder().indexOf(0)<5?5:0)}
function openNeg(id){const m=S.market.find(x=>x.id===id);if(!m)return;const d=demand(m);NEG={id,w:d,y:Math.min(4,m.age>=30?2:3),ilk11:false,kap:false,proje:null,cl:'yok',tries:m.tries||0,tk:null,gb:false,mb:false};render()}
function negP(){const m=S.market.find(x=>x.id===NEG.id);if(!m)return 0;const d=demand(m);
 let p=35+(NEG.w/d-1)*70+(NEG.ilk11?15:0)+(NEG.kap?10:0)+(NEG.proje||0)+({yok:0,yuksek:4,dusuk:12}[NEG.cl])-(m.rv?10:0)-Math.max(0,(m.r-S.guc-4)*2.5)-(S.div===2?15:0)-NEG.tries*8+(m.age>=30&&NEG.y>=3?5:0)+(m.age<=23&&NEG.y<=2?4:0)+(m.wk?8:0)+(NEG.gb?6:0)+(NEG.mb?6:0)+(agOf(m)?(agOf(m).rel-50)*.2:0);
 return clamp(Math.round(p),3,95)}
function negSet(k,v){if(!NEG)return;NEG[k]=v;render()}
function negProje(){if(NEG.proje!=null)return;const r=rep();NEG.proje=Math.round(r/4+RI(-4,6));snd('click');render()}
function negCost(m){const sw=NEG&&NEG.tk!=null&&P(NEG.tk)?swapVal(P(NEG.tk)):0;return Math.max(0,m.cost+(m.rv?2:0)-sw)+commission(m)}
function negOffer(){const m=S.market.find(x=>x.id===NEG.id);if(!m)return;const c=negCost(m);if(S.st.k-c<1)return toast('Kasa bonservise yetmez.');if(S.squad.length>=26)return toast('Kadro dolu (26).');
 const pr=negP();if(Math.random()*100<pr){S.st.k-=c;fin('transfer',-c);budSpend(c);agAdj(m,5);if(NEG.tk!=null){const sp=P(NEG.tk);if(sp&&S.squad.length>16){removeP(sp);log(`Takas: ${sp.n} karşı tarafa gitti.`);tnews(`${sp.n}, takasla ${m.club}’a gitti.`)}}const p=addP(m.pos,m.r,m.age,0,m.n,NEG.y);p.pot=m.pot;p.w=r1(NEG.w);p.ag=m.ag;if(NEG.gb||NEG.mb)p.bon={gol:NEG.gb,mac:NEG.mb};
  if(NEG.ilk11)p.prom={ilk11:1,pm:0,ps:0};if(NEG.kap){const old=kapP();if(old&&old.id!==p.id)old.msb=(old.msb||0)-20;S.kap=p.id;p.capProm=1}
  if(NEG.cl!=='yok')p.clause=Math.round(price(p)*(NEG.cl==='dusuk'?1.2:2.5));
  if(m.rv){const rb=S.rbs.find(x=>x.c===m.rv);if(rb)rb.rel=clamp(rb.rel-10,0,100);tnews(`${S.club}, ${m.rv} ile kapıştığı ${m.n}’i kaptı!`)}
  const ma=S.yk.find(x=>x.gun==='tasarruf'),fy=S.yk.find(x=>x.gun==='yildiz');ma.sad=clamp(ma.sad-Math.round(c*.3),0,100);fy.sad=clamp(fy.sad+3,0,100);
  S.market=S.market.filter(x=>x!==m);validateXI();if(m.r>=S.guc+4){S.st.t=clamp(S.st.t+2,0,100);news(`${S.club} bombayı patlattı: ${p.n}!`)}
  log(`Transfer: ${p.n} (${p.r}) · bonservis ${eur(c)}, maaş ${eur1(p.w)}/yıl, ${NEG.y} yıl${NEG.ilk11?', ilk 11 sözü':''}${NEG.kap?', kaptanlık sözü':''}${p.clause?`, serbest kalma ${eur(p.clause)}`:''}.`);
  NEG=null;snd('coin');toast(`✍️ ${p.n} imzayı attı!`)}

const BMULT={1:.6,2:.8,3:1,4:1.25,5:1.5},BU={1:1,2:0,3:0,4:-1,5:-2},BA={1:2,2:1,3:0,4:-1,5:-3},BK={1:-1,2:0,3:0,4:1,5:1};
function ticketCalc(b,derby){const dol=clamp(Math.round(55+(S.newStad?10:0)+(S.st.t-50)*.6-(b-3)*12+(S.fac.stad-1)*3+(derby?15:0)-(S.build&&S.build.stad?15:0)),12,100);
 const base=(S.div===1?{buyuk:.8,anadolu:.4,yeni:.3}[S.type]:.15)*(S.newStad?1.8:1);
 const tk=Math.round(base*(1+.08*(S.fac.stad-1))*BMULT[b]*(dol/70)*(S.build&&S.build.stad?.6:1)*100)/100;return{dol,tk}}
function setBilet(b){const old=S.bilet||3;if(b===old)return;const d=b-old;S.bilet=b;fanAdj(-d*2,-d*2.5,d);
 const tx=d>0?pick(['Ultralar zamma tepki gösterdi: "Futbol zenginlerin oyunu olmasın!"','Taraftar dernekleri bilet zammını protesto etti.','Aileler yeni bilet fiyatlarından şikâyetçi.']):pick(['İndirim tribünde sevinçle karşılandı.','Taraftar dernekleri indirimi alkışladı.','Aileler stada dönmeye hazırlanıyor.']);
 S.biletMsg=tx;news(tx);log(`Bilet fiyatı: ${BILET[old].n} → ${BILET[b].n}. ${tx}`);toast(tx);snd('click');save();render()}

 ${S.biletMsg?`<div class="banner" style="margin-top:8px">📣 ${esc(S.biletMsg)}</div>`:''}
 <div class="small" style="margin-top:6px">Gruplar şu an: 🔥 ${S.fans.ultra} · 👨‍👩‍👧 ${S.fans.aile} · 💼 ${S.fans.kur}</div></div>`}

// ---- bütçe: yönetimin önerisi ve onayı ----
function projSeason(){const tk=ticketCalc(S.bilet||3).tk*17,fo=formaInc()*34,yay=S.div===1?{buyuk:8,anadolu:6,yeni:5}[S.type]:2;
 const sp=Object.values(S.sp||{}).reduce((a,s)=>a+(s?s.pay:0),0),side=sideIncome();const inc=r1(tk+fo+yay+sp+side);
 const loan=(S.loans||[]).reduce((a,l)=>a+Math.min(l.left,5)*l.inst,0);const exp=r1(seasonWages()+loan+2);return{inc,exp,net:r1(inc-exp)}}
function budRec(){const p=projSeason();return{t:clamp(Math.round(S.st.k*.4+p.net*.4),Math.round(S.st.k*.15),Math.max(0,S.st.k-5)),w:r1(seasonWages()*1.03)}}
function defaultBud(){const r=budRec();return{t:r.t,w:r.w}}
function budApproveP(){const b=S.bud,rc=budRec();let p=95;if(b.t>rc.t)p-=(b.t-rc.t)/Math.max(3,rc.t)*55;if(b.w>rc.w)p-=(b.w/rc.w-1)*180;p+=(ykAvg()-50)*.5;return clamp(Math.round(p),5,95)}
function budgetConfirm(){S.bud=S.bud||defaultBud();const rc=budRec();const asked={...S.bud};let msg;
 if(asked.t<=rc.t&&asked.w<=rc.w){msg='Yönetim kurulu bütçeyi oybirliğiyle onayladı.';apply({c:1},false)}
 else if(Math.random()*100<budApproveP()){msg='Yönetim kurulu yüksek bütçeyi oy çokluğuyla onayladı. Beklentiler de yükseldi.';ykAdj('tasarruf',-8);if(asked.t>rc.t*1.3){const T=TYPE[S.type];S.expMid=Math.max(1,(S.div===1?T.exp:3)-1);msg+=` Sezon hedefi: ilk ${S.expMid}.`}}
 else{msg=`Yönetim kurulu bütçeyi reddetti. Önerilen bütçe uygulanacak: transfer ${eur(rc.t)}, maaş tavanı ${eur1(rc.w)}.`;S.bud.t=rc.t;S.bud.w=Math.min(asked.w,rc.w);apply({c:-2},false)}
 if(S.hoca&&S.hoca.bud&&S.bud.t<rc.t){S.moral=clamp(S.moral-5,0,100);msg+=' Hoca, transfer bütçesi sözünün tutulmamasına kızdı.'}
 S.bud.s=S.season;S.tSpent=0;S.budMsg=msg;S.phase='card';S.card=pickCard();log(`Bütçe: ${msg}`);toast(msg);snd('click');save();render();window.scrollTo(0,0)}
function budSpend(v){const b=S.bud;const before=S.tSpent||0;S.tSpent=before+v;if(b&&b.s===S.season&&v>0&&S.tSpent>b.t){apply({c:-2},false);ykAdj('tasarruf',-6);toast(`⚠️ Transfer bütçesi aşıldı (${eur(S.tSpent)} / ${eur(b.t)}). Yönetim rahatsız.`);log(`Transfer bütçesi aşıldı: ${eur(S.tSpent)} / ${eur(b.t)}.`)}}
function budgetHTML(){const b=S.bud||defaultBud();const rc=budRec();const pj=projSeason();const ap=budApproveP();const sw=seasonWages();
 return `<div class="panel"><h2>📒 Sezon ${S.season} bütçe planı</h2><div class="small mut">Yönetim kurulu kasaya ve sezonun gelir-gider tahminine göre bir bütçe öneriyor. Önerinin üstünü istersen kurul oylar; reddederse önerilen bütçe uygulanır ve kongre rahatsız olur.</div>
 ${kv('Kasa',eur(S.st.k))}${kv('Tahmini sezon geliri',`<span class="up">${eur1(pj.inc)}</span>`)}${kv('Tahmini sezon gideri',`<span class="dn">${eur1(pj.exp)}</span> <span class="small mut">(maaşlar ${eur1(sw)} + kredi taksitleri)</span>`)}${kv('Tahmini net',`<b class="${pj.net>=0?'up':'dn'}">${pj.net>=0?'+':''}${eur1(pj.net)}</b>`)}
 <div class="lbl">Transfer bütçesi: <b>${eur(b.t)}</b> · yönetimin önerisi ${eur(rc.t)}</div><input type="range" min="0" max="${Math.max(1,S.st.k)}" step="1" value="${b.t}" onchange="budSet('t',this.value)">
 <div class="lbl">Maaş tavanı: <b>${eur1(b.w)}</b>/sezon · öneri ${eur1(rc.w)}</div><input type="range" min="${r1(sw*.8)}" max="${r1(sw*1.4)}" step="0.5" value="${b.w}" onchange="budSet('w',this.value)">
 <div class="pbar"><span>Kurulun onaylama olasılığı</span><div class="bar"><i style="width:${ap}%;background:${ap>=70?'var(--grn)':ap>=40?'var(--gold)':'var(--red)'}"></i></div><b>%${ap}</b></div>
 <div class="small mut">Satışlar transfer bütçesine geri eklenir. Sezon içinde bütçeyi aşan her transfer anında kongre ve mali işlerden tepki alır.</div>
 <div style="display:flex;gap:8px;margin-top:10px"><button class="sbtn" onclick="budSet('t',${rc.t});budSet('w',${rc.w})">Öneriyi kullan</button><button class="btn pri" style="flex:1;margin:0" onclick="budgetConfirm()">Kurula sun ➜</button></div></div>`}

// ---- bonservis pazarlığı (satan kulüp) ----
function openNeg(id){const m=S.market.find(x=>x.id===id);if(!m)return;if(m.pat==null)m.pat=RI(55,100);const d=demand(m);
 NEG={id,stage:m.feeOk!=null?'oyuncu':'kulup',fee:m.feeOk!=null?m.feeOk:Math.round(m.cost*.85),w:d,y:Math.min(4,m.age>=30?2:3),ilk11:false,kap:false,proje:null,cl:'yok',tries:m.tries||0,tk:null,gb:false,mb:false,counter:null};render()}
function clubP(){const m=S.market.find(x=>x.id===NEG.id);if(!m)return 0;const ask=m.cost+(m.rv?2:0);const sw=NEG.tk!=null&&P(NEG.tk)?swapVal(P(NEG.tk))*.9:0;const ratio=(NEG.fee+sw)/Math.max(1,ask);
 return clamp(Math.round((ratio-.62)/.4*100-(m.rv?8:0)+(m.pat-70)*.2),2,97)}
function clubOffer(){const m=S.market.find(x=>x.id===NEG.id);if(!m)return;const ask=m.cost+(m.rv?2:0);const sw=NEG.tk!=null&&P(NEG.tk)?swapVal(P(NEG.tk))*.9:0;const ratio=(NEG.fee+sw)/Math.max(1,ask);
 if(Math.random()*100<clubP()){m.feeOk=NEG.fee;m.tkOk=NEG.tk;NEG.stage='oyuncu';NEG.counter=null;toast(`${m.club} bonservis teklifini kabul etti. Şimdi oyuncuyla görüş.`);snd('coin')}
 else{m.pat-=Math.round(Math.max(0,1-ratio)*50+12);if(m.pat<=0){S.market=S.market.filter(x=>x!==m);NEG=null;toast(`${m.club} sabrı taştı, görüşmeleri kesti.`);news(`${m.club}, ${S.club} ile ${m.n} görüşmelerini bitirdi.`)}
  else{if(ratio>=.75){NEG.counter=Math.max(NEG.fee+1,Math.round((NEG.fee+sw+ask)/2-sw));toast(`${m.club} reddetti ama karşı teklif verdi: ${eur(NEG.counter)}`)}else{NEG.counter=null;toast(`${m.club} teklifi ciddiye almadı. Sabırları azalıyor.`)}}}
 save();render()}
function acceptCounter(){const m=S.market.find(x=>x.id===NEG.id);if(!m||NEG.counter==null)return;NEG.fee=NEG.counter;m.feeOk=NEG.fee;m.tkOk=NEG.tk;NEG.stage='oyuncu';NEG.counter=null;toast('Karşı teklif kabul edildi. Şimdi oyuncuyla görüş.');snd('coin');save();render()}
function negCost(m){const fee=m.feeOk!=null?m.feeOk:NEG.fee;return Math.max(0,fee)+commission(m)}
function negOffer(){const m=S.market.find(x=>x.id===NEG.id);if(!m)return;if(m.feeOk==null)return;const c=negCost(m);if(S.st.k-c<1)return toast('Kasa bonservise yetmez.');if(S.squad.length>=26)return toast('Kadro dolu (26).');NEG.tk=m.tkOk;
 const pr=negP();if(Math.random()*100<pr){S.st.k-=c;fin('transfer',-c);agAdj(m,5);if(NEG.tk!=null){const sp=P(NEG.tk);if(sp&&S.squad.length>16){removeP(sp);log(`Takas: ${sp.n} karşı tarafa gitti.`);tnews(`${sp.n}, takasla ${m.club}’a gitti.`)}}
  const p=addP(m.pos,m.r,m.age,0,m.n,NEG.y);p.pot=m.pot;p.w=r1(NEG.w);p.ag=m.ag;if(NEG.gb||NEG.mb)p.bon={gol:NEG.gb,mac:NEG.mb};
  if(NEG.ilk11)p.prom={ilk11:1,pm:0,ps:0};if(NEG.kap){const old=kapP();if(old&&old.id!==p.id)old.msb=(old.msb||0)-20;S.kap=p.id;p.capProm=1}
  if(NEG.cl!=='yok')p.clause=Math.round(price(p)*(NEG.cl==='dusuk'?1.2:2.5));
  if(m.rv){const rb=S.rbs.find(x=>x.c===m.rv);if(rb)rb.rel=clamp(rb.rel-10,0,100);tnews(`${S.club}, ${m.rv} ile kapıştığı ${m.n}’i kaptı!`)}
  const ma=S.yk.find(x=>x.gun==='tasarruf'),fy=S.yk.find(x=>x.gun==='yildiz');ma.sad=clamp(ma.sad-Math.round(c*.3),0,100);fy.sad=clamp(fy.sad+3,0,100);
  S.market=S.market.filter(x=>x!==m);validateXI();if(m.r>=S.guc+4){S.st.t=clamp(S.st.t+2,0,100);S.formaB=(S.formaB||0)+.3;news(`${S.club} bombayı patlattı: ${p.n}!`)}
  log(`Transfer: ${p.n} (${p.r}) · bonservis ${eur(m.feeOk)} + komisyon ${eur(commission(m))}, maaş ${eur1(p.w)}/yıl, ${NEG.y} yıl${NEG.ilk11?', ilk 11 sözü':''}${NEG.kap?', kaptanlık sözü':''}${p.clause?`, serbest kalma ${eur(p.clause)}`:''}.`);
  budSpend(c);NEG=null;snd('coin');toast(`✍️ ${p.n} imzayı attı!`)}
 else{agAdj(m,-3);m.tries=(m.tries||0)+1;NEG.tries=m.tries;if(m.tries>=3){S.market=S.market.filter(x=>x!==m);NEG=null;toast(`${m.n} görüşmeleri kesti ve başka kulübe gitti.`);news(`${m.n}, ${S.club}’un teklifini reddetti.`)}else toast(`${m.n} teklifi reddetti. Şartları iyileştirip tekrar dene.`)}
 save();render()}
function negHTML(m){const ask=m.cost+(m.rv?2:0);const ag=agOf(m);const col=v=>v>=60?'var(--grn)':v>=35?'var(--gold)':'var(--red)';
 const pat=`<div class="pbar"><span>${esc(m.club)} sabrı</span><div class="bar"><i style="width:${clamp(m.pat,0,100)}%;background:${col(m.pat)}"></i></div><b>${Math.max(0,m.pat)}</b></div>`;
 if(NEG.stage==='kulup'){const sw=S.squad.filter(p=>!p.loan).sort((a,b)=>b.r-a.r).slice(0,8);const pr=clubP();
  return `<div class="talk"><div class="small"><b>1. Aşama · Kulüple bonservis pazarlığı:</b> ${esc(m.club)} ${esc(m.n)} için <b>${eur(ask)}</b> istiyor.${m.rv?` ⚔️ ${esc(m.rv)} de bu oyuncunun peşinde.`:''}</div>

function sqDel(T,p){const L=oppSquad(T.n,T.s);const b=xiAvg(L);L.splice(L.indexOf(p),1);if(L.filter(x=>x.pos===p.pos).length<2){L.push({n:nm(),pos:p.pos,r:clamp(Math.round(T.s-RI(6,12)),40,80),age:RI(18,21),pot:clamp(T.s+RI(0,6),40,90),sz:0})}T.s=clamp(Math.round(T.s+(xiAvg(L)-b)),45,85)}

  G:[['1. Lig’e yüksel',()=>DIVN[S.div],()=>S.div===1],['1. Lig’i ilk 3’te bitir',()=>S.sum&&S.sum.div===1?`son derece ${S.sum.pos}.`:'henüz yok',()=>S.sum&&S.sum.div===1&&S.sum.pos<=3]]},
 ezeli:{n:'Ezeli rakibin gölgesi',i:'🔥',type:'anadolu',dl:2,diff:'Çok zor',
  d:'Şehrin öbür yakasındaki ezeli rakip yıllardır kazanıyor; kadrosu da kasası da güçlü. Taraftar artık sadece bir şey istiyor: onları sahada ve tabloda geçmek.',
  goal:'2 sezonda şampiyonluk ve en az 2 derbi galibiyeti',
  G:[['Ezeli rakibi en az 2 kez yen',()=>`${((S.h2h||{})[S.rivalN]||{w:0}).w} galibiyet`,()=>((S.h2h||{})[S.rivalN]||{w:0}).w>=2],['1. Lig şampiyonu ol',()=>S.museum.some(m=>m.t==='lig')?'şampiyon!':'henüz değil',()=>S.museum.some(m=>m.t==='lig')]]},
 kriz:{n:'Boş tribünler',i:'📣',type:'anadolu',dl:1,diff:'Orta',
  d:'Kötü yönetim, pahalı biletler ve kırık sözler… Taraftar küs, ultralar boykot ilan etmiş, statlar boş. Bir sezonda kalpleri geri kazan.',
  goal:'Sezon sonunda taraftar desteği 60+ ve ultralar 40+',
  G:[['Taraftar desteğini 60’a çıkar',()=>`%${S.st.t}`,()=>S.st.t>=60],['Ultraları barıştır (40+)',()=>`${Math.round(S.fans?S.fans.ultra:0)}`,()=>S.fans&&S.fans.ultra>=40]]},
 yildiz:{n:'Yıldızı tut',i:'⭐',type:'buyuk',dl:2,diff:'Orta',
  d:'Takımın yıldızı ligin en iyi oyuncusu ama sözleşmesinin son yılında. Avrupa devleri kapıda, menajeri pazarlıkta. Onu kulüpte tut ve onunla kupaya uzan.',
  goal:'Yıldızı satmadan sözleşmesini uzat ve 2 sezonda bir ilk 3',
  G:[['Yıldız kulüpte kalsın',()=>{const p=S.squad.find(x=>x.star);return p?esc(p.n):'gitti!'},()=>S.squad.some(x=>x.star)],['Sözleşmesini en az 2 yıl uzat',()=>{const p=S.squad.find(x=>x.star);return p?`${p.ct} sezon`:'-'},()=>{const p=S.squad.find(x=>x.star);return p&&p.ct>=2}],['Ligi ilk 3’te bitir',()=>S.sum&&S.sum.pos?`son derece ${S.sum.pos}.`:'henüz yok',()=>S.scnBest&&S.scnBest<=3]]},
 ffp:{n:'Federasyon kıskacında',i:'⚖️',type:'anadolu',dl:2,full:1,diff:'Zor',
  d:'Kulüp geçen yıl mali denge kurallarını çiğnemiş: kış dönemine kadar transfer yasağı var ve maaş yükü gelirlerin çok üstünde. Kadroyu satmadan dengeyi kur.',
  goal:'2 sezon boyunca mali denge ihlali yok, sonunda oran %100 altı · ligden düşme',
  G:[['Mali denge ihlali yapma',()=>S.scnFfpBad?'ihlal var!':'temiz',()=>!S.scnFfpBad],['Gider/gelir oranı %100 altı',()=>`%${ffpCalc().pct}`,()=>ffpCalc().pct<=100],['1. Lig’de kal',()=>DIVN[S.div],()=>S.div===1]]},
 genc:{n:'Altyapı devrimi',i:'🌱',type:'yeni',dl:3,diff:'Orta',
  d:'Parası olmayan küçük bir kulüp, ama altyapısında cevherler var. Yeni başkan olarak kulübü kendi yetiştirdiği oyuncularla ayakta tutacaksın.',
  goal:'3 sezonda A takımda 5 altyapı oyuncusu ve ilk 8',
  G:[['A takımda 5 altyapı oyuncusu',()=>`${S.squad.filter(p=>p.yth).length}/5`,()=>S.squad.filter(p=>p.yth).length>=5],['Ligi ilk 8’de bitir',()=>S.sum&&S.sum.pos?`son derece ${S.sum.pos}.`:'henüz yok',()=>S.scnBest&&S.scnBest<=8&&S.div===1]]}});
function scnInit(id){const s=S;s.scnIntro=1;
 if(id==='borc'){s.st.k=24;s.st.c=38;s.st.m=40;s.loans=[{t:'uzun',left:6,inst:4,auto:true,due:0,late:0},{t:'orta',left:3,inst:4,auto:true,due:0,late:0}];s.squad.forEach(p=>p.w=r1((p.w||demand(p))*1.15));s.fac.stad=Math.max(1,s.fac.stad-1)}
 if(id==='ezeli'){const r=s.lig[1].find(t=>t.n===s.rivalN);r.s=81;s.rb.ger=80;s.st.t=45}
 if(id==='kriz'){s.st.t=28;s.fans={ultra:20,aile:30,kur:40};s.bilet=5}
 if(id==='yukselis'){const strong=s.lig[2].slice().sort((a,b)=>b.s-a.s)[0];s.lig[2]=s.lig[2].filter(t=>t!==strong);s.lig[1].push(strong);s.div=2;s.euroNext=false;s.st.k=18}
 if(id==='yildiz'){const p=addP('F',88,26,0,null,1);p.star=1;p.pot=91;p.w=r1(demand(p)*.8);p.per='lider';s.st.k=Math.max(s.st.k,35)}
 if(id==='ffp'){s.tban=s.season*400+wins()[1][1];s.squad.forEach(p=>p.w=r1((p.w||demand(p))*1.45));s.st.k=14;s.ffpH=[134]}
 if(id==='genc'){s.st.k=12;s.fac.alt=Math.max(3,s.fac.alt);s.u19=(s.u19||[]).concat([0,1,2,3].map(()=>{const y=mkYouth();y.age=RI(17,18);y.r=clamp(y.r+6,40,72);y.pot=clamp(y.pot+10,60,90);return y}))}}
function scnCheck(sum){const id=S.scn&&S.scn.id;if(!id||S.scn.done)return null;const X=SCN[id];if(!X)return null;
 if(sum&&sum.div===1&&sum.pos)S.scnBest=Math.min(S.scnBest||99,sum.pos);
 if(id==='yildiz'&&!S.squad.some(p=>p.star))return 'lose';if((id==='borc'||id==='ffp')&&S.div===2)return 'lose';if(id==='ffp'&&S.scnFfpBad)return 'lose';
 const ok=(!X.full||S.season>=X.dl)&&X.G.every(g=>g[2]());
 if(ok){S.scn.done=S.season;const g=store.get('baskanKoltugu_senaryo')||[];if(!g.includes(id)){g.push(id);store.set('baskanKoltugu_senaryo',g)}snd('trophy');return 'win'}
 if(S.season>=X.dl)return 'lose';return null}
ffpCheck=(function(f){return function(w){const b=S.ffpX;f(w);if(S.scn&&S.scn.id==='ffp'&&S.ffpX!==b)S.scnFfpBad=1}})(ffpCheck);
function scnHTML(){const id=S.scn&&S.scn.id;const X=id&&SCN[id];if(!X||S.scn.done)return '';const left=X.dl-S.season+1;
 return `<div class="panel scnp"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${X.i} Senaryo: ${X.n}</h2><span class="small ${left<=1?'dn':'gold'}">${left} sezon kaldı</span></div>${X.G.map(g=>{const ok=g[2]();return `<div class="kv"><span>${ok?'✅':'⬜'} ${g[0]}</span><b class="${ok?'up':''}">${g[1]()}</b></div>`}).join('')}<div class="small mut">Bitiş: ${X.dl}. sezon sonu · ${X.goal}</div></div>`}
function scnIntroHTML(){const id=S.scn&&S.scn.id;const X=SCN[id];return `<div class="ozov"><div class="ozbox"><h2 class="sech">${X.i} ${X.n}</h2><div class="panel"><div style="font-size:15px;line-height:1.5">${X.d}</div><div class="lbl">Hedefler</div>${X.G.map(g=>`<div class="kv"><span>⬜ ${g[0]}</span><b>${g[1]()}</b></div>`).join('')}${kv('Süre',`${X.dl} sezon`)}${kv('Zorluk',X.diff)}</div><button class="btn pri" onclick="S.scnIntro=0;save();render()">Göreve başla ›</button></div></div>`}
officeHTML=(function(f){return function(){const h=f();if(DOC!=null||ROOM)return h;const k=h.indexOf('<div class="gcard">');const s=scnHTML();return k>0?h.slice(0,k)+s+h.slice(k):s+h}})(officeHTML);
render=(function(f){return function(){f();if(S&&VIEW==='game'&&S.scnIntro&&S.scn&&SCN[S.scn.id]&&S.phase!=='over'){$('#app').insertAdjacentHTML('beforeend',scnIntroHTML())}}})(render);

removeP=(function(f){return function(p){if(p&&p.star&&!SELLING&&S.scn&&S.scn.id==='yildiz')return;return f(p)}})(removeP);
let SELLING=0;sellP=(function(f){return function(...a){SELLING=1;try{return f(...a)}finally{SELLING=0}}})(sellP);
rnP=(function(f){return function(){let v=f();const p=RN&&P(RN.id);if(p&&p.star&&S.scn&&S.scn.id==='yildiz'){const pos=rankOrder().indexOf(0)+1;v+=pos<=3?12:pos<=6?4:-6}return clamp(v,1,99)}})(rnP);
const _mig20=migrate;migrate=function(s){s=_mig20(s);s.loans=s.loans||[];
 if(s.loan&&s.loan.left>0){s.loans.push({t:'orta',left:s.loan.left,inst:s.loan.pay||3,auto:true,due:0,late:0});s.loan=null}
 if(s.scn&&s.scn.id==='borc'&&!s.scn.done&&!s.scnFix){s.scnFix=1;if(!s.loans.length&&s.season<=1){s.loans.push({t:'uzun',left:6,inst:4,auto:true,due:0,late:0},{t:'orta',left:3,inst:4,auto:true,due:0,late:0})}}
 return s};

render();
</script>
